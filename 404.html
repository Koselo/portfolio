<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Michal Podskoč</title>
  <link rel="icon" type="image/png" href="assets/favicon2.png">
  <link rel="shortcut icon" href="assets/favicon2.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #FAFAF8;
      --text:    #111110;
      --muted:   #888882;
      --accent:  #C0392B;
      --border:  #E0D9CE;
      --surface: #F0EBE3;
      --px:      80px;
      --nav-h:   80px;
      font-family: 'Satoshi', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 100;
      display: flex; align-items: center;
      padding: 0 var(--px);
      justify-content: space-between;
    }
    .nav-logo {
      font-size: 15px; font-weight: 500;
      color: var(--text); text-decoration: none;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: var(--nav-h) var(--px) 80px;
    }

    .err-code {
      font-size: clamp(100px, 18vw, 220px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: var(--border);
      user-select: none;
    }

    .err-msg {
      font-size: clamp(22px, 3.5vw, 48px);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-top: 32px;
      line-height: 1.15;
    }

    .err-sub {
      font-size: 16px;
      color: var(--muted);
      margin-top: 16px;
      line-height: 1.6;
    }

    .err-char {
      width: clamp(60px, 10vw, 110px);
      margin-top: 48px;
      animation: charFloat 3.5s ease-in-out infinite;
    }
    @keyframes charFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 40px;
      font-size: 15px; font-weight: 500;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    @media (max-width: 768px) {
      :root { --px: 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Michal Podskoč</a>
  </nav>

  <main>
    <span class="err-code">404</span>
    <p class="err-msg">Page not found.</p>
    <p class="err-sub">Looks like this page doesn't exist — or maybe it never did.</p>
    <img src="assets/character-alt.svg" class="err-char" alt="">
    <a href="/" class="back-link">← Back to home</a>
  </main>

</body>
</html>
